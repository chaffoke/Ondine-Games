<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Meowdoku × Ondine</title>
<meta name="theme-color" content="#06081e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06081e;--bg2:#090c24;
  --c1:#38bdf8;--c2:#7dd3fc;--c3:#bae6fd;
  --cp:#818cf8;--cg:#34d399;--co:#fbbf24;--cr:#f87171;--cm:#f472b6;
  --glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.09);--glass3:rgba(56,189,248,.07);
  --border:rgba(56,189,248,.12);--border2:rgba(56,189,248,.22);
  --text:#e0f2fe;--text2:#94a3b8;
  --r:14px;--r2:20px;
  --sh:0 4px 20px rgba(0,0,0,.5);--sh2:0 8px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;overflow:hidden;}
.screen.hidden{display:none!important;}
.ondine-btn{font-family:'Fredoka One',cursive;border:none;border-radius:var(--r2);cursor:pointer;transition:transform .12s;}
.ondine-btn:active{transform:scale(.955);}
.ondine-btn-primary{background:linear-gradient(135deg,#3730a3,#0e7490);color:#fff;padding:15px 28px;font-size:17px;box-shadow:0 6px 24px rgba(14,116,144,.45);}
.ondine-btn-secondary{background:var(--glass);border:1.5px solid var(--border);color:var(--text);padding:11px 22px;font-weight:800;font-size:13px;font-family:'Nunito',sans-serif;}
.ondine-btn-danger{background:rgba(248,113,113,.12);border:1.5px solid rgba(248,113,113,.35);color:var(--cr);padding:11px 22px;font-weight:800;font-size:13px;font-family:'Nunito',sans-serif;}
.ondine-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(15,25,60,.92);border:1px solid var(--border2);border-radius:12px;padding:10px 18px;font-size:13px;font-weight:700;color:var(--text);backdrop-filter:blur(12px);z-index:9999;opacity:0;transition:all .3s;white-space:nowrap;max-width:80vw;text-align:center;pointer-events:none;}
.ondine-toast-show{opacity:1;transform:translateX(-50%) translateY(0);}
.modal-overlay{position:fixed;inset:0;z-index:9500;background:rgba(6,8,30,.85);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.hidden{display:none;}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);padding:22px;max-width:320px;width:100%;box-shadow:var(--sh2);}
.modal-title{font-family:'Fredoka One',cursive;font-size:17px;color:var(--c2);margin-bottom:10px;text-align:center;}
.modal-body{font-size:13px;color:var(--text);margin-bottom:16px;text-align:center;line-height:1.5;}
.modal-actions{display:flex;flex-direction:column;gap:8px;}
.statCard{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:12px 8px;text-align:center;}
.statCard .v{font-family:'Fredoka One',cursive;font-size:19px;color:var(--c1);}
.statCard .l{font-size:8px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.achCard{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:9px 11px;}
.achCard.unlocked{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.05);}
.achCard .ic{font-size:22px;}
.achCard .name{font-weight:800;font-size:12px;}
.achCard .desc{font-size:9px;color:var(--text2);}

/* ── HOME ── */
#sh{align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px;overflow-y:auto;}
.logo{font-family:'Fredoka One',cursive;font-size:clamp(30px,9vw,42px);
  background:linear-gradient(160deg,#e0f2fe,#7dd3fc 35%,#fff 55%,#bae6fd 80%,#e0f2fe);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-sub{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--c2);opacity:.65;}
.section-title{font-size:10px;text-transform:uppercase;letter-spacing:2.5px;color:var(--text2);font-weight:800;width:100%;max-width:320px;text-align:left;margin-top:6px;}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:320px;}
.opt-card{background:var(--glass);border:2px solid var(--border);border-radius:var(--r);padding:12px 8px;cursor:pointer;text-align:center;transition:all .15s;}
.opt-card.sel{border-color:var(--c1);background:var(--glass3);}
.opt-icon{font-size:20px;margin-bottom:3px;}
.opt-name{font-family:'Fredoka One',cursive;font-size:12px;}
.hbtns{display:flex;flex-direction:column;gap:9px;width:100%;max-width:320px;}
.hstats{display:flex;gap:7px;width:100%;max-width:320px;}

/* ── GAME ── */
#sg{align-items:center;padding:10px;gap:10px;}
.game-header{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:400px;}
.turn-badge{display:flex;align-items:center;gap:7px;background:var(--glass);border:1px solid var(--border);border-radius:12px;padding:6px 14px;font-family:'Fredoka One',cursive;font-size:13px;}
.turn-dot{width:15px;height:15px;border-radius:50%;box-shadow:inset 0 -2px 3px rgba(0,0,0,.35);}
.turn-dot.black{background:radial-gradient(circle at 35% 30%,#555,#0a0a0a 70%);}
.turn-dot.white{background:radial-gradient(circle at 35% 30%,#fff,#cbd5e1 70%);}
.score-row{display:flex;gap:8px;}
.score-pill{display:flex;align-items:center;gap:5px;background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:4px 10px;font-family:'Fredoka One',cursive;font-size:13px;}

.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;background:rgba(6,60,40,.5);border:1px solid var(--border2);border-radius:12px;padding:6px;max-width:min(400px, calc(100vh - 180px));width:100%;aspect-ratio:1;box-shadow:var(--sh2);}
/* Polish desktop (même correctif que Puissance 4, même cause) */
@media (min-width:900px){.board{max-width:600px;}}
.cell{position:relative;background:rgba(10,90,60,.55);border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.cell.hint::after{content:'';width:22%;height:22%;border-radius:50%;background:rgba(255,255,255,.35);}
.disc{width:84%;height:84%;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.4);transform:scale(0) rotateY(0deg);transition:transform .35s cubic-bezier(.34,1.56,.64,1);}
.disc.show{transform:scale(1);}
.disc.black{background:radial-gradient(circle at 35% 28%,#4a4a4a,#0a0a0a 72%);}
.disc.white{background:radial-gradient(circle at 35% 28%,#fff,#c7d2e0 72%);}
.disc.flip{animation:flipDisc .4s ease;}
@keyframes flipDisc{0%{transform:scale(1) rotateY(0);}50%{transform:scale(.75) rotateY(90deg);}100%{transform:scale(1) rotateY(0);}}
.disc.last-move{box-shadow:0 0 0 3px var(--co),0 2px 5px rgba(0,0,0,.4);}

.game-footer{display:flex;gap:8px;width:100%;max-width:400px;}

/* ── RESULT ── */
#sres{align-items:center;justify-content:center;text-align:center;background:rgba(6,8,30,.6);backdrop-filter:blur(6px);z-index:100;gap:8px;padding:20px;}
.res-icon{font-size:56px;}
.res-title{font-family:'Fredoka One',cursive;font-size:22px;color:var(--c2);}
.res-sub{font-size:13px;color:var(--text2);}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:280px;margin:12px 0;}

/* ── STATS ── */
#sstats{align-items:flex-start;padding:16px;overflow-y:auto;gap:0;}
.shead{width:100%;display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.stitle{font-family:'Fredoka One',cursive;font-size:19px;color:var(--c2);}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-bottom:14px;}
.ach-list{width:100%;display:flex;flex-direction:column;gap:6px;}
.icon-btn{width:36px;height:36px;background:var(--glass);border:1px solid var(--border);border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;}
.ondine-hub-link{margin-top:6px;font-size:11px;font-weight:800;color:var(--text2);opacity:.6;cursor:pointer;text-align:center;padding:6px;}

/* ═══════════════════════════════════════════════════════════════
   MEOWDOKU — CSS spécifique (grille à régions, chats, palette)
   ═══════════════════════════════════════════════════════════════ */
:root{
  --reg0:#f87171;--reg1:#fb923c;--reg2:#fbbf24;--reg3:#34d399;--reg4:#22d3ee;
  --reg5:#818cf8;--reg6:#c084fc;--reg7:#f472b6;--reg8:#94a3b8;
}
.mw-board{display:grid;gap:2px;width:100%;max-width:min(420px, calc(100vh - 320px));aspect-ratio:1;background:#0a0e24;border-radius:14px;padding:4px;box-shadow:0 4px 20px rgba(0,0,0,.4);}
.mw-play-area{display:flex;flex-direction:column;align-items:center;width:100%;gap:10px;}
.mw-side-controls{display:flex;flex-direction:column;align-items:center;width:100%;gap:8px;}
/* Paysage sur petit écran : empiler plateau + rappel + indice +
   toolbar verticalement ne laisse plus assez de hauteur pour le
   plateau (mesuré : cases descendant jusqu'à 5px pour 9×9, largement
   sous le seuil tactile). On passe en disposition côte à côte, le
   plateau exploitant la HAUTEUR disponible plutôt que d'être contraint
   par une marge fixe pensée pour le portrait — même principe que la
   correction déjà appliquée à Snake/Othello. */
@media (orientation: landscape) and (max-height: 500px) {
  .mw-play-area{flex-direction:row;justify-content:center;align-items:flex-start;gap:16px;}
  .mw-board{max-width:min(420px, calc(100vh - 90px));}
  .mw-side-controls{width:220px;flex-shrink:0;}
  .mw-toolbar{grid-template-columns:1fr;}
}
.mw-cell{position:relative;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;transition:transform .1s;font-size:min(6vw,26px);}
.mw-cell:active{transform:scale(.93);}
.mw-cell.mw-r0{background:#6b2d19;}
.mw-cell.mw-r1{background:#867e27;}
.mw-cell.mw-r2{background:#3a6f15;}
.mw-cell.mw-r3{background:#27863e;}
.mw-cell.mw-r4{background:#196b64;}
.mw-cell.mw-r5{background:#274e86;}
.mw-cell.mw-r6{background:#2b156f;}
.mw-cell.mw-r7{background:#7e2786;}
.mw-cell.mw-r8{background:#7a1e44;}
.mw-cell .mw-mark{font-size:0.7em;color:rgba(255,255,255,.55);pointer-events:none;}
.mw-cell .mw-cat{font-size:1em;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));animation:mwPop .18s ease-out;}
.mw-cell.mw-conflict{outline:3px solid #f87171;outline-offset:-3px;animation:mwShake .3s;}
.mw-cell.mw-hint{outline:3px solid #fde047;outline-offset:-3px;}
@keyframes mwPop{from{transform:scale(0);}to{transform:scale(1);}}
@keyframes mwShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
.mw-hud{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:420px;gap:8px;margin-bottom:8px;}
.mw-rule-reminder{font-size:11px;color:var(--text2);text-align:center;width:100%;max-width:420px;margin-bottom:8px;}
.mw-hud-item{background:var(--glass);border:1px solid var(--border);border-radius:12px;padding:6px 12px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:4px;}
.mw-toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:420px;margin-top:10px;}
.mw-size-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:340px;}
.mw-size-card{background:var(--glass);border:2px solid var(--border);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;font-weight:800;font-size:13px;}
.mw-size-card.sel{border-color:var(--c1);background:var(--glass3);}
.mw-hint-box{background:var(--glass2);border:1px solid var(--border2);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--text);width:100%;max-width:420px;margin-top:8px;text-align:center;min-height:20px;}
.mw-win-cats{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:10px 0;font-size:28px;}
.opt-grid.cols4{grid-template-columns:1fr 1fr 1fr 1fr;}
.result-overlay{align-items:center;justify-content:center;text-align:center;background:rgba(6,8,30,.75);backdrop-filter:blur(6px);z-index:100;gap:8px;padding:20px;}
.mw-modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(4,6,20,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;}
.mw-modal-box{background:linear-gradient(180deg,#0f1530,#080b1e);border:1px solid var(--border2);border-radius:20px;padding:20px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.5);}
.mw-modal-title{font-family:'Fredoka One',cursive;font-size:18px;color:var(--c2);margin-bottom:12px;text-align:center;}
.mw-modal-body{font-size:14px;color:var(--text);line-height:1.6;}
.mw-modal-body p{margin:0 0 10px;}
.mw-modal-actions{display:flex;flex-direction:column;gap:8px;margin-top:16px;}

</style>
<body>

<div class="screen" id="sh">
  <div class="ondine-logo">MEOWDOKU</div>
  <div class="ondine-logo-sub">× Ondine</div>
  <div id="homeStatsMw"></div>
  <div class="section-title">Taille de grille</div>
  <div class="mw-size-grid" id="sizeGridMw">
    <div class="mw-size-card" data-size="5" onclick="setSizeMw(5)">5×5</div>
    <div class="mw-size-card sel" data-size="6" onclick="setSizeMw(6)">6×6</div>
    <div class="mw-size-card" data-size="7" onclick="setSizeMw(7)">7×7</div>
    <div class="mw-size-card" data-size="8" onclick="setSizeMw(8)">8×8</div>
    <div class="mw-size-card" data-size="9" onclick="setSizeMw(9)">9×9</div>
  </div>
  <div class="section-title">Difficulté</div>
  <div class="opt-grid cols4" id="diffGridMw">
    <div class="opt-card" id="diffMw_facile" onclick="setDifficultyMw('facile')">🌱 Facile</div>
    <div class="opt-card sel" id="diffMw_normal" onclick="setDifficultyMw('normal')">⚡ Normal</div>
    <div class="opt-card" id="diffMw_difficile" onclick="setDifficultyMw('difficile')">🔥 Difficile</div>
    <div class="opt-card" id="diffMw_expert" onclick="setDifficultyMw('expert')">💀 Expert</div>
  </div>
  <button class="ondine-btn ondine-btn-primary" id="startBtnMw" onclick="startNewPuzzle()">🐱 Jouer</button>
  <button class="ondine-btn ondine-btn-secondary" id="resumeBtnMw" onclick="resumePuzzle()" style="display:none;">▶ Reprendre</button>
  <button class="ondine-btn ondine-btn-secondary" onclick="showRulesMw()">ⓘ Règles</button>
  <button class="ondine-btn ondine-btn-secondary" onclick="showStats()">📊 Succès</button>
  <div class="ondine-hub-link" onclick="window.location.href='../index.html'">🎮 Tous les jeux Ondine</div>
</div>

<div class="screen hidden" id="sg">
  <div class="mw-hud">
    <div class="icon-btn" onclick="confirmLeaveMw()">🏠</div>
    <div class="mw-hud-item">⏱ <span id="timerMw">0:00</span></div>
    <div class="mw-hud-item">🎯 <span id="movesMw">0</span></div>
    <div class="icon-btn" onclick="showRulesMw()">ⓘ</div>
  </div>
  <div class="mw-play-area">
    <div class="mw-board" id="boardMw"></div>
    <div class="mw-side-controls">
      <div class="mw-rule-reminder">1 chat par ligne, colonne <b>et par couleur</b> — jamais 2 côte à côte</div>
      <div class="mw-hint-box" id="hintBoxMw" style="display:none;"></div>
      <div class="mw-toolbar">
        <button class="ondine-btn ondine-btn-secondary" onclick="undoMw()">↩️ Annuler</button>
        <button class="ondine-btn ondine-btn-secondary" onclick="resetPuzzleMw()">🔄 Reset</button>
        <button class="ondine-btn ondine-btn-secondary" onclick="giveHintMw()">💡 Indice</button>
        <button class="ondine-btn ondine-btn-primary" onclick="checkSolutionMw()">✓ Vérifier</button>
      </div>
    </div>
  </div>
</div>

<div class="screen hidden result-overlay" id="swinMw">
  <div class="res-icon">🏆</div>
  <div class="res-title">Résolu !</div>
  <div class="mw-win-cats" id="winCatsMw"></div>
  <div class="res-sub" id="winStatsMw"></div>
  <div class="hbtns">
    <button class="ondine-btn ondine-btn-primary" onclick="startNewPuzzle()">🔄 Nouveau puzzle</button>
    <button class="ondine-btn ondine-btn-secondary" onclick="goHome()">🏠 Accueil</button>
  </div>
</div>

<div class="screen hidden" id="sstats">
  <div class="shead">
    <div class="icon-btn" onclick="goHome()">←</div>
    <div class="stitle">Statistiques</div>
  </div>
  <div class="stats-grid" id="statsGridMw"></div>
</div>

<script>
// ═══ Solveur logique (déduction humaine) ═══
// ═══════════════════════════════════════════════════════════════
// Solveur LOGIQUE HUMAIN — simule les déductions qu'un joueur peut
// faire SANS jamais "essayer au hasard" (aucun backtracking). Sert à
// vérifier qu'un puzzle généré est résoluble par PURE déduction, pas
// seulement par une recherche exhaustive que l'ordinateur peut faire
// mais qu'un humain ressentirait comme deviner.
//
// Techniques implémentées :
// 1. Élimination directe : toute case de la même ligne/colonne/région
//    qu'un chat placé, ou adjacente à un chat placé, est éliminée.
// 2. Singleton caché : si une ligne/colonne/région n'a plus qu'UNE
//    case possible, un chat y est placé.
// 3. Confinement région→ligne/colonne : si toutes les cases encore
//    possibles d'une région sont dans une même ligne (ou colonne),
//    alors cette ligne ne peut PAS contenir le chat d'une AUTRE
//    région — on élimine les cases des autres régions dans cette
//    ligne (technique standard, valide : cette région DOIT placer son
//    chat dans cette ligne, donc la ligne est "prise" par elle).
// ═══════════════════════════════════════════════════════════════

function isAdjacent(r1, c1, r2, c2) {
  return Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1 && !(r1 === r2 && c1 === c2);
}

/** Retourne { solved, placedCount, technique_usage, stuckState } —
 *  solved=true si résolu par pure déduction (aucune supposition). */
function solveLogically(n, regionOf) {
  // possible[r][c] = true/false
  const possible = Array.from({ length: n }, () => Array(n).fill(true));
  const placed = []; // [r,c]
  const rowDone = Array(n).fill(false);
  const colDone = Array(n).fill(false);
  const regionDone = Array(n).fill(false);
  const usage = { elimination: 0, nakedSingle: 0, confinement: 0 };

  function eliminateForPlacement(pr, pc) {
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (!possible[r][c]) continue;
      if (r === pr && c === pc) continue;
      if (r === pr || c === pc || regionOf[r][c] === regionOf[pr][pc] || isAdjacent(pr, pc, r, c)) {
        possible[r][c] = false;
        usage.elimination++;
      }
    }
  }

  function place(r, c) {
    placed.push([r, c]);
    rowDone[r] = true; colDone[c] = true; regionDone[regionOf[r][c]] = true;
    for (let rr = 0; rr < n; rr++) for (let cc = 0; cc < n; cc++) if (!(rr === r && cc === c)) possible[rr][cc] = possible[rr][cc] && !(rr===r||cc===c||regionOf[rr][cc]===regionOf[r][c]||isAdjacent(r,c,rr,cc));
  }

  let progress = true;
  let iterations = 0;
  while (progress && placed.length < n && iterations < 500) {
    progress = false;
    iterations++;

    // Technique 2 : singleton caché par ligne
    for (let r = 0; r < n; r++) {
      if (rowDone[r]) continue;
      const cells = [];
      for (let c = 0; c < n; c++) if (possible[r][c]) cells.push([r, c]);
      if (cells.length === 1) { place(cells[0][0], cells[0][1]); usage.nakedSingle++; progress = true; }
    }
    if (progress) continue;
    // par colonne
    for (let c = 0; c < n; c++) {
      if (colDone[c]) continue;
      const cells = [];
      for (let r = 0; r < n; r++) if (possible[r][c]) cells.push([r, c]);
      if (cells.length === 1) { place(cells[0][0], cells[0][1]); usage.nakedSingle++; progress = true; }
    }
    if (progress) continue;
    // par région
    for (let reg = 0; reg < n; reg++) {
      if (regionDone[reg]) continue;
      const cells = [];
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (regionOf[r][c] === reg && possible[r][c]) cells.push([r, c]);
      if (cells.length === 1) { place(cells[0][0], cells[0][1]); usage.nakedSingle++; progress = true; }
    }
    if (progress) continue;

    // Technique 3 : confinement région -> ligne/colonne
    for (let reg = 0; reg < n; reg++) {
      if (regionDone[reg]) continue;
      const cells = [];
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (regionOf[r][c] === reg && possible[r][c]) cells.push([r, c]);
      if (cells.length === 0) continue;
      const rows = new Set(cells.map(([r]) => r));
      if (rows.size === 1) {
        const row = [...rows][0];
        let changed = false;
        for (let c = 0; c < n; c++) if (possible[row][c] && regionOf[row][c] !== reg) { possible[row][c] = false; changed = true; }
        if (changed) { usage.confinement++; progress = true; }
      }
      const cols = new Set(cells.map(([, c]) => c));
      if (cols.size === 1) {
        const col = [...cols][0];
        let changed = false;
        for (let r = 0; r < n; r++) if (possible[r][col] && regionOf[r][col] !== reg) { possible[r][col] = false; changed = true; }
        if (changed) { usage.confinement++; progress = true; }
      }
    }
    if (progress) continue;

    // Technique 4 (symétrique de 3) : confinement ligne/colonne -> région.
    // Si toutes les cases restantes d'une LIGNE appartiennent à UNE
    // SEULE région, cette région doit placer son chat dans cette ligne
    // -> on élimine les cases de cette région situées HORS de la ligne.
    // Sans cette symétrie, de nombreuses déductions valides (accessibles
    // à un joueur humain) restaient invisibles au solveur.
    for (let r = 0; r < n; r++) {
      if (rowDone[r]) continue;
      const cells = [];
      for (let c = 0; c < n; c++) if (possible[r][c]) cells.push([r, c]);
      if (cells.length === 0) continue;
      const regs = new Set(cells.map(([, c]) => regionOf[r][c]));
      if (regs.size === 1) {
        const reg = [...regs][0];
        let changed = false;
        for (let rr = 0; rr < n; rr++) for (let cc = 0; cc < n; cc++) {
          if (rr !== r && regionOf[rr][cc] === reg && possible[rr][cc]) { possible[rr][cc] = false; changed = true; }
        }
        if (changed) { usage.confinement++; progress = true; }
      }
    }
    if (progress) continue;
    for (let c = 0; c < n; c++) {
      if (colDone[c]) continue;
      const cells = [];
      for (let r = 0; r < n; r++) if (possible[r][c]) cells.push([r, c]);
      if (cells.length === 0) continue;
      const regs = new Set(cells.map(([r]) => regionOf[r][c]));
      if (regs.size === 1) {
        const reg = [...regs][0];
        let changed = false;
        for (let rr = 0; rr < n; rr++) for (let cc = 0; cc < n; cc++) {
          if (cc !== c && regionOf[rr][cc] === reg && possible[rr][cc]) { possible[rr][cc] = false; changed = true; }
        }
        if (changed) { usage.confinement++; progress = true; }
      }
    }
  }

  return { solved: placed.length === n, placedCount: placed.length, usage, iterations };
}


// ═══ Moteur de génération ═══
// ═══════════════════════════════════════════════════════════════
// MEOWDOKU — moteur logique, basé sur les vraies règles du jeu
// "Queens" (LinkedIn) : grille N×N divisée en N régions colorées,
// un chat par ligne, par colonne, par région, aucune adjacence
// (y compris diagonale) entre deux chats.
// ═══════════════════════════════════════════════════════════════



function inBounds(n, r, c) { return r >= 0 && r < n && c >= 0 && c < n; }

function isAdjacent(r1, c1, r2, c2) {
  return Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1 && !(r1 === r2 && c1 === c2);
}

/** Génère une solution valide : N cases (une par ligne), colonnes
 *  toutes distinctes, aucune paire adjacente (8 directions). Backtracking
 *  randomisé pour varier les solutions générées. */
function generateSolution(n, rng = Math.random) {
  const cols = Array.from({ length: n }, (_, i) => i);
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  const placed = [];
  function backtrack(row) {
    if (row === n) return true;
    const candidates = shuffle(cols.filter((c) => !placed.some((p) => p.c === c)));
    for (const c of candidates) {
      if (placed.some((p) => isAdjacent(p.r, p.c, row, c))) continue;
      placed.push({ r: row, c });
      if (backtrack(row + 1)) return true;
      placed.pop();
    }
    return false;
  }
  if (!backtrack(0)) return null;
  return placed.map((p) => [p.r, p.c]);
}

/** Partitionne la grille N×N en N régions connexes, chacune contenant
 *  EXACTEMENT une case de la solution — via croissance aléatoire
 *  compétitive (chaque région "grandit" tour à tour depuis sa
 *  frontière) jusqu'à couvrir toute la grille. */
function partitionIntoRegions(n, solution, rng = Math.random) {
  const regionOf = Array.from({ length: n }, () => Array(n).fill(-1));
  solution.forEach(([r, c], i) => { regionOf[r][c] = i; });
  const frontiers = solution.map(([r, c]) => [[r, c]]);
  let remaining = n * n - n;
  function neighbors4(r, c) {
    return [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].filter(([rr, cc]) => inBounds(n, rr, cc));
  }
  while (remaining > 0) {
    const order = Array.from({ length: n }, (_, i) => i);
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    let grew = false;
    for (const region of order) {
      if (remaining <= 0) break;
      const frontier = frontiers[region];
      const candidates = [];
      for (const [r, c] of frontier) {
        for (const [rr, cc] of neighbors4(r, c)) {
          if (regionOf[rr][cc] === -1) candidates.push([rr, cc]);
        }
      }
      if (!candidates.length) continue;
      const [pr, pc] = candidates[Math.floor(rng() * candidates.length)];
      regionOf[pr][pc] = region;
      frontiers[region].push([pr, pc]);
      remaining--;
      grew = true;
    }
    if (!grew) {
      // reste des cases isolées (rare) : les rattache à un voisin déjà assigné
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
        if (regionOf[r][c] === -1) {
          const assignedNeighbor = neighbors4(r, c).find(([rr, cc]) => regionOf[rr][cc] !== -1);
          if (assignedNeighbor) { regionOf[r][c] = regionOf[assignedNeighbor[0]][assignedNeighbor[1]]; remaining--; }
        }
      }
      if (remaining > 0 && !grew) break; // sécurité anti-boucle infinie
    }
  }
  return remaining === 0 ? regionOf : null;
}

/** Résout le puzzle par backtracking EXHAUSTIF (compte les solutions
 *  jusqu'à 2, pour déterminer 0 / 1 / plusieurs sans calcul inutile).
 *  `given` = cases déjà connues (indices), respectées comme contraintes
 *  fixes. Retourne { count, solution, nodesExplored } — nodesExplored
 *  sert de proxy de DIFFICULTÉ RÉELLE (plus il faut explorer de
 *  branches pour trouver/écarter des solutions, plus le puzzle exige
 *  de déduction — pas un simple essai-erreur). */
function countSolutions(n, regionOf, given = []) {
  const rowUsed = Array(n).fill(false);
  const colUsed = Array(n).fill(false);
  const regionUsed = Array(n).fill(false);
  const placed = [];
  let count = 0;
  let nodesExplored = 0;
  let firstSolution = null;

  for (const [r, c] of given) {
    rowUsed[r] = true; colUsed[c] = true; regionUsed[regionOf[r][c]] = true;
    placed.push([r, c]);
  }

  function backtrack(row) {
    if (count >= 2) return;
    if (row === n) {
      count++;
      if (count === 1) firstSolution = placed.slice();
      return;
    }
    if (rowUsed[row]) { backtrack(row + 1); return; }
    for (let c = 0; c < n; c++) {
      nodesExplored++;
      if (colUsed[c] || regionUsed[regionOf[row][c]]) continue;
      if (placed.some(([pr, pc]) => isAdjacent(pr, pc, row, c))) continue;
      rowUsed[row] = true; colUsed[c] = true; regionUsed[regionOf[row][c]] = true;
      placed.push([row, c]);
      backtrack(row + 1);
      placed.pop();
      rowUsed[row] = false; colUsed[c] = false; regionUsed[regionOf[row][c]] = false;
      if (count >= 2) return;
    }
  }
  backtrack(0);
  return { count, solution: count === 1 ? firstSolution : null, nodesExplored };
}

function isConnected(n, regionOf, region) {
  const cells = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (regionOf[r][c] === region) cells.push([r, c]);
  if (!cells.length) return false;
  const visited = new Set([cells[0].join(',')]);
  const stack = [cells[0]];
  while (stack.length) {
    const [r, c] = stack.pop();
    for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < n && nc >= 0 && nc < n && regionOf[nr][nc] === region && !visited.has(`${nr},${nc}`)) {
        visited.add(`${nr},${nc}`); stack.push([nr, nc]);
      }
    }
  }
  return visited.size === cells.length;
}

/** Répare une partition à solutions multiples en basculant des cases
 *  frontalières vers une région voisine, en ne gardant QUE les swaps
 *  qui préservent la connexité des deux régions concernées ET ne font
 *  jamais disparaître la solution cible (count ne descend jamais à 0).
 *  Mesuré empiriquement BIEN plus efficace qu'une génération aléatoire
 *  répétée : la partition aléatoire pure atteint l'unicité sur moins
 *  de 0.4% des essais dès n=5, et quasi 0% au-delà de n=6 — la
 *  réparation itérative atteint 100% pour n≤7 et reste praticable
 *  jusqu'à n=9 en moins de 2s. */
function repairToUnique(n, regionOf, rng, maxRepairs = 400) {
  let current = regionOf.map((row) => row.slice());
  let result = countSolutions(n, current, []);
  let repairs = 0;
  while (result.count !== 1 && repairs < maxRepairs) {
    repairs++;
    const frontierCells = [];
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < n && nc >= 0 && nc < n && current[nr][nc] !== current[r][c]) {
          frontierCells.push([r, c, current[nr][nc]]);
          break;
        }
      }
    }
    if (!frontierCells.length) break;
    let improved = false;
    const shuffled = frontierCells.sort(() => rng() - 0.5);
    for (const [r, c, newRegion] of shuffled.slice(0, 40)) {
      const oldRegion = current[r][c];
      current[r][c] = newRegion;
      if (isConnected(n, current, oldRegion) && isConnected(n, current, newRegion)) {
        const newResult = countSolutions(n, current, []);
        if (newResult.count === 0) { current[r][c] = oldRegion; continue; }
        if (newResult.count <= result.count) { result = newResult; improved = true; break; }
      }
      current[r][c] = oldRegion;
    }
    if (!improved) break;
  }
  return result.count === 1 ? { regions: current, result } : null;
}

/** Génère un puzzle COMPLET : solution + partition en régions dont
 *  l'unicité de solution est garantie SANS AUCUN INDICE de case, ET
 *  dont la résolubilité par PURE DÉDUCTION LOGIQUE (sans backtracking,
 *  via solveLogically) est GARANTIE — un niveau qui ne serait
 *  résoluble que par recherche exhaustive donnerait au joueur humain
 *  l'impression de devoir deviner, même si la solution reste
 *  mathématiquement unique. Mesuré empiriquement : sans cette
 *  exigence, seulement 15-40% des niveaux générés étaient résolubles
 *  par déduction pure ; avec elle, 100% le sont par construction.
 *  La difficulté est calibrée sur un score de complexité LOGIQUE
 *  (usage de la technique de confinement + nombre d'itérations
 *  nécessaires), avec des SEUILS ABSOLUS par taille de grille calibrés
 *  empiriquement (voir DIFFICULTY_RANGES) — préféré à une sélection
 *  par percentile sur un petit échantillon de candidats, mesurée
 *  instable (Expert pouvait ressortir plus facile que Difficile avec
 *  seulement 3 candidats). On s'arrête dès qu'un candidat tombe dans
 *  la plage cible, ce qui reste rapide (pas besoin d'en collecter
 *  plusieurs). */
function difficultyScore(logic) {
  return logic.usage.confinement * 3 + logic.iterations;
}
const DIFFICULTY_RANGES = {
  5: { facile: [0, 5], normal: [5, 10], difficile: [10, 16], expert: [16, Infinity] },
  6: { facile: [0, 6], normal: [6, 12], difficile: [12, 18], expert: [18, Infinity] },
  7: { facile: [0, 7], normal: [7, 14], difficile: [14, 20], expert: [20, Infinity] },
  8: { facile: [0, 10], normal: [10, 18], difficile: [18, 25], expert: [25, Infinity] },
  9: { facile: [0, 12], normal: [12, 20], difficile: [20, 28], expert: [28, Infinity] },
};

function generatePuzzle(n, difficulty, rng = Math.random, maxAttempts = null) {
  // Chaque tentative coûte plus cher en temps CPU pour les grandes
  // grilles (repairToUnique + solveLogically sur plus de cases) — un
  // maxAttempts fixe de 150 pouvait mener à des générations de
  // plusieurs secondes en 9×9 (mesuré jusqu'à 4.8s). Un maxAttempts
  // décroissant avec la taille ramène le pire cas mesuré à ~1.8s pour
  // 9×9, avec un taux de succès resté à 100% sur l'échantillon testé.
  if (maxAttempts === null) maxAttempts = { 5: 150, 6: 150, 7: 150, 8: 80, 9: 40 }[n] || 100;
  const ranges = DIFFICULTY_RANGES[n] || DIFFICULTY_RANGES[7];
  const [lo, hi] = ranges[difficulty] || ranges.normal;
  let best = null, bestDist = Infinity;
  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    const solution = generateSolution(n, rng);
    if (!solution) continue;
    const initialRegions = partitionIntoRegions(n, solution, rng);
    if (!initialRegions) continue;
    const repaired = repairToUnique(n, initialRegions, rng);
    if (!repaired) continue;
    const { regions, result } = repaired;
    const logic = solveLogically(n, regions);
    if (!logic.solved) continue; // rejette tout niveau non résoluble par pure logique
    const score = difficultyScore(logic);
    const candidate = { n, regions, solution: result.solution, difficulty, logicScore: score, logicUsage: logic.usage, attempts: attempt + 1 };
    if (score >= lo && score < hi) return candidate;
    const mid = isFinite(hi) ? (lo + hi) / 2 : lo * 1.5;
    const dist = Math.abs(score - mid);
    if (dist < bestDist) { bestDist = dist; best = candidate; }
  }
  return best;
}


// ═══════════════════════════════════════════════════════════════
// MEOWDOKU — interface, câblée sur le moteur ci-dessus.
// ═══════════════════════════════════════════════════════════════
const CAT_EMOJIS = ['🐱','🐈','🐈‍⬛','😺','😸','😻','🙀','😽','🐾'];
const STORE_KEY = 'meowdoku_ondine_v2';
function loadStore() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } }
function saveStore(s) { localStorage.setItem(STORE_KEY, JSON.stringify(s)); }
let STORE = Object.assign({ stats: {}, save: null }, loadStore());
function statGet(k, d) { return k in STORE.stats ? STORE.stats[k] : (d === undefined ? 0 : d); }
function statInc(k, n) { STORE.stats[k] = (STORE.stats[k] || 0) + (n || 1); saveStore(STORE); return STORE.stats[k]; }
function statSetMin(k, v) { if (STORE.stats[k] === undefined || v < STORE.stats[k]) { STORE.stats[k] = v; saveStore(STORE); } }

let CONFIG = { size: 6, difficulty: 'normal' };
let PUZZLE = null; // { n, regions, solution, difficulty }
// état d'une case : 0=vide, 1=marquée X, 2=chat posé
let cellState = [];
let moves = 0, elapsed = 0, timerInterval = null, over = true, history = [];

function setSizeMw(n) {
  CONFIG.size = n;
  document.querySelectorAll('.mw-size-card').forEach((el) => el.classList.toggle('sel', Number(el.dataset.size) === n));
}
function setDifficultyMw(d) {
  CONFIG.difficulty = d;
  ['facile', 'normal', 'difficile', 'expert'].forEach((k) => document.getElementById('diffMw_' + k).classList.toggle('sel', k === d));
}

function emptyState(n) { return Array.from({ length: n }, () => Array(n).fill(0)); }

function startNewPuzzle() {
  const n = CONFIG.size;
  document.getElementById('boardMw').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text2);">🐱 Génération du puzzle…</div>';
  document.getElementById('sg').classList.remove('hidden');
  document.querySelectorAll('.screen').forEach((s) => { if (s.id !== 'sg') s.classList.add('hidden'); });
  // laisse le tememps au navigateur de peindre le message avant le calcul (peut prendre jusqu'à ~1s)
  setTimeout(() => {
    PUZZLE = generatePuzzle(n, CONFIG.difficulty, Math.random);
    if (!PUZZLE) { toast('Échec de génération, réessaie'); goHome(); return; }
    cellState = emptyState(n);
    moves = 0; elapsed = 0; over = false; history = [];
    document.getElementById('boardMw').style.gridTemplateColumns = 'repeat(' + n + ', 1fr)';
    persist();
    startTimer();
    render();
  }, 30);
}

function resumePuzzle() {
  const saved = STORE.save;
  if (!saved) { startNewPuzzle(); return; }
  PUZZLE = saved.puzzle; cellState = saved.cellState; moves = saved.moves; elapsed = saved.elapsed; over = false; history = [];
  document.querySelectorAll('.screen').forEach((s) => s.classList.add('hidden'));
  document.getElementById('sg').classList.remove('hidden');
  document.getElementById('boardMw').style.gridTemplateColumns = 'repeat(' + PUZZLE.n + ', 1fr)';
  startTimer();
  render();
}

function persist() { STORE.save = { puzzle: PUZZLE, cellState: cellState, moves: moves, elapsed: elapsed }; saveStore(STORE); }

function startTimer() {
  stopTimer();
  timerInterval = setInterval(() => {
    elapsed++;
    const m = Math.floor(elapsed / 60), s = elapsed % 60;
    document.getElementById('timerMw').textContent = m + ':' + String(s).padStart(2, '0');
  }, 1000);
}
function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }

/** Calcule les VRAIS conflits actuels (adjacence, doublons ligne/col/région)
 *  entre chats POSÉS (état 2) — jamais entre marques X, qui ne sont
 *  qu'une aide mémoire du joueur. */
function computeConflicts(n, regions, state) {
  const cats = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (state[r][c] === 2) cats.push([r, c]);
  const conflictSet = new Set();
  for (let i = 0; i < cats.length; i++) {
    for (let j = i + 1; j < cats.length; j++) {
      const [r1, c1] = cats[i], [r2, c2] = cats[j];
      const sameRow = r1 === r2, sameCol = c1 === c2, sameRegion = regions[r1][c1] === regions[r2][c2];
      const adj = Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1;
      if (sameRow || sameCol || sameRegion || adj) { conflictSet.add(r1 + ',' + c1); conflictSet.add(r2 + ',' + c2); }
    }
  }
  return conflictSet;
}

function cycleCell(r, c) {
  if (over || !PUZZLE) return;
  const cur = cellState[r][c];
  history.push(cellState.map((row) => row.slice()));
  cellState[r][c] = (cur + 1) % 3; // vide -> X -> chat -> vide
  moves++;
  persist();
  render();
  maybeCheckWin(true);
}

function undoMw() {
  if (!history.length) return;
  cellState = history.pop();
  persist();
  render();
}

function resetPuzzleMw() {
  if (!PUZZLE) return;
  history.push(cellState.map((row) => row.slice()));
  cellState = emptyState(PUZZLE.n);
  moves = 0;
  persist();
  render();
}

function render() {
  if (!PUZZLE) return;
  const n = PUZZLE.n;
  const board = document.getElementById('boardMw');
  board.innerHTML = '';
  const conflicts = computeConflicts(n, PUZZLE.regions, cellState);
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      const el = document.createElement('div');
      const region = PUZZLE.regions[r][c];
      el.className = 'mw-cell mw-r' + region;
      if (conflicts.has(r + ',' + c)) el.classList.add('mw-conflict');
      if (cellState[r][c] === 1) el.innerHTML = '<span class="mw-mark">✕</span>';
      else if (cellState[r][c] === 2) el.innerHTML = '<span class="mw-cat">🐱</span>';
      el.onclick = () => cycleCell(r, c);
      board.appendChild(el);
    }
  }
  document.getElementById('movesMw').textContent = moves;
}

function maybeCheckWin(silent) {
  if (!PUZZLE) return false;
  const n = PUZZLE.n;
  const cats = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (cellState[r][c] === 2) cats.push([r, c]);
  if (cats.length !== n) { if (!silent) toast('Il faut exactement ' + n + ' chats placés'); return false; }
  const conflicts = computeConflicts(n, PUZZLE.regions, cellState);
  if (conflicts.size > 0) { if (!silent) toast('Il reste des conflits (cases en rouge)'); return false; }
  // n chats, une ligne/colonne/région chacun (garanti par computeConflicts=vide + n chats),
  // donc c'est FORCÉMENT LA solution (unique par construction du générateur).
  winPuzzle();
  return true;
}

function checkSolutionMw() { maybeCheckWin(false); }

function winPuzzle() {
  over = true;
  stopTimer();
  STORE.save = null; saveStore(STORE);
  statInc('games');
  statInc('wins');
  statSetMin('bestMoves_' + PUZZLE.n, moves);
  statSetMin('bestTime_' + PUZZLE.n, elapsed);
  const catsHost = document.getElementById('winCatsMw');
  catsHost.innerHTML = '';
  for (let i = 0; i < PUZZLE.n; i++) { const span = document.createElement('span'); span.textContent = CAT_EMOJIS[i % CAT_EMOJIS.length]; catsHost.appendChild(span); }
  document.getElementById('winStatsMw').textContent = moves + ' coups en ' + Math.floor(elapsed / 60) + ':' + String(elapsed % 60).padStart(2, '0');
  document.querySelectorAll('.screen').forEach((s) => s.classList.add('hidden'));
  document.getElementById('swinMw').classList.remove('hidden');
}

/** Indice — cherche une déduction RÉELLE en tenant compte des chats déjà
 *  posés ET des marques du joueur (état actuel), avec les MÊMES
 *  techniques que le solveur de génération (élimination, singleton,
 *  confinement région<->ligne/colonne) — sans cette complétude,
 *  mesuré empiriquement qu'un niveau entièrement résoluble par pure
 *  logique pouvait laisser le joueur bloqué sur "2 cases possibles"
 *  en boucle, sans jamais recevoir l'indice à 1 case qui aurait
 *  débloqué la suite (la 1ère déduction nécessitait justement le
 *  confinement, absent de la version précédente de cet indice). */
function computeHintState(n, regions, cellState) {
  const possible = Array.from({ length: n }, () => Array(n).fill(true));
  const cats = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (cellState[r][c] === 1) possible[r][c] = false; // marque X du joueur = respectée telle quelle
    if (cellState[r][c] === 2) cats.push([r, c]);
  }
  const usedRows = new Set(), usedCols = new Set(), usedRegions = new Set();
  for (const [pr, pc] of cats) {
    usedRows.add(pr); usedCols.add(pc); usedRegions.add(regions[pr][pc]);
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (r === pr || c === pc || regions[r][c] === regions[pr][pc] || (Math.abs(r - pr) <= 1 && Math.abs(c - pc) <= 1 && !(r === pr && c === pc))) possible[r][c] = false;
    }
  }
  return { possible, usedRows, usedCols, usedRegions };
}

function giveHintMw() {
  if (!PUZZLE || over) return;
  const n = PUZZLE.n, regions = PUZZLE.regions;
  const { possible, usedRows, usedCols, usedRegions } = computeHintState(n, regions, cellState);
  const hintBox = document.getElementById('hintBoxMw');
  hintBox.style.display = '';
  document.querySelectorAll('.mw-cell.mw-hint').forEach((el) => el.classList.remove('mw-hint'));

  function cellsOf(type, idx) {
    const cells = [];
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (!possible[r][c]) continue;
      if ((type === 'ligne' && r === idx) || (type === 'colonne' && c === idx) || (type === 'région' && regions[r][c] === idx)) cells.push([r, c]);
    }
    return cells;
  }
  const groups = [];
  for (let r = 0; r < n; r++) if (!usedRows.has(r)) groups.push({ type: 'ligne', idx: r, cells: cellsOf('ligne', r) });
  for (let c = 0; c < n; c++) if (!usedCols.has(c)) groups.push({ type: 'colonne', idx: c, cells: cellsOf('colonne', c) });
  for (let reg = 0; reg < n; reg++) if (!usedRegions.has(reg)) groups.push({ type: 'région', idx: reg, cells: cellsOf('région', reg) });

  // 1) cherche d'abord un singleton direct (déduction la plus simple à expliquer)
  groups.sort((a, b) => a.cells.length - b.cells.length);
  const singleton = groups.find((g) => g.cells.length === 1);
  if (singleton) {
    statInc('hintsUsed');
    const [r, c] = singleton.cells[0];
    hintBox.textContent = 'Cette ' + singleton.type + ' ne peut accueillir son chat que dans 1 case : ligne ' + (r + 1) + ', colonne ' + (c + 1) + '.';
    document.getElementById('boardMw').children[r * n + c].classList.add('mw-hint');
    return;
  }

  // 2) sinon, cherche une déduction par confinement (région dont les
  // cases restantes tiennent toutes dans une seule ligne/colonne, ou
  // inversement) — explique le raisonnement, indique la zone concernée
  // sans donner directement la case finale.
  for (const g of groups) {
    if (g.type !== 'région' || g.cells.length === 0) continue;
    const rows = new Set(g.cells.map(([r]) => r));
    const cols = new Set(g.cells.map(([, c]) => c));
    if (rows.size === 1) {
      statInc('hintsUsed');
      hintBox.textContent = 'Le chat de cette région doit forcément être dans la ligne ' + ([...rows][0] + 1) + ' — aucune autre région ne peut y placer son chat.';
      g.cells.forEach(([r, c]) => document.getElementById('boardMw').children[r * n + c].classList.add('mw-hint'));
      return;
    }
    if (cols.size === 1) {
      statInc('hintsUsed');
      hintBox.textContent = 'Le chat de cette région doit forcément être dans la colonne ' + ([...cols][0] + 1) + ' — aucune autre région ne peut y placer son chat.';
      g.cells.forEach(([r, c]) => document.getElementById('boardMw').children[r * n + c].classList.add('mw-hint'));
      return;
    }
  }
  for (const g of groups) {
    if (g.type === 'région' || g.cells.length === 0) continue;
    const regs = new Set(g.cells.map(([r, c]) => regions[r][c]));
    if (regs.size === 1) {
      statInc('hintsUsed');
      hintBox.textContent = 'Toutes les cases encore possibles de cette ' + g.type + ' appartiennent à la même région — son chat doit forcément être ici.';
      g.cells.forEach(([r, c]) => document.getElementById('boardMw').children[r * n + c].classList.add('mw-hint'));
      return;
    }
  }

  // 3) sinon, indique simplement le groupe le plus contraint restant
  const best = groups.find((g) => g.cells.length > 0);
  if (!best) { hintBox.textContent = 'Aucune déduction directe trouvée — vérifie tes marques.'; return; }
  statInc('hintsUsed');
  hintBox.textContent = 'Cette ' + best.type + ' ne peut accueillir son chat que dans ' + best.cells.length + ' cases.';
  best.cells.forEach(([r, c]) => { document.getElementById('boardMw').children[r * n + c].classList.add('mw-hint'); });
}

function showModal(title, bodyHTML, buttons) {
  const overlay = document.createElement('div');
  overlay.className = 'mw-modal-overlay';
  const box = document.createElement('div');
  box.className = 'mw-modal-box';
  box.innerHTML = '<div class="mw-modal-title">' + title + '</div><div class="mw-modal-body">' + bodyHTML + '</div>';
  const actions = document.createElement('div');
  actions.className = 'mw-modal-actions';
  buttons.forEach((b) => {
    const btn = document.createElement('button');
    btn.className = 'ondine-btn ' + (b.variant === 'primary' ? 'ondine-btn-primary' : 'ondine-btn-secondary');
    btn.textContent = b.label;
    btn.onclick = () => { document.body.removeChild(overlay); b.onClick && b.onClick(); };
    actions.appendChild(btn);
  });
  box.appendChild(actions);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function showRulesMw() {
  showModal('🐱 Comment jouer',
    '<p>La grille est divisée en zones de couleur. <b>Chaque couleur = une famille de chats.</b></p>' +
    '<p><b>Règles :</b></p>' +
    '<p>• Exactement 1 chat par ligne<br>• Exactement 1 chat par colonne<br>• Exactement 1 chat par couleur (donc 1 seul par zone colorée)<br>• Deux chats ne peuvent jamais être côte à côte, même en diagonale</p>' +
    '<p><b>Comment jouer :</b> touche une case vide pour y mettre une croix (case impossible), touche à nouveau pour y placer un chat, touche une 3<sup>e</sup> fois pour vider la case.</p>' +
    '<p>Chaque puzzle a une solution UNIQUE, déductible logiquement — pas besoin d\u2019essayer au hasard.</p>',
    [{ label: 'Compris', variant: 'primary' }]);
}

async function confirmLeaveMw() {
  if (PUZZLE && !over) {
    const ok = await UI_confirmDialog('Quitter la partie ?', 'Le puzzle en cours sera sauvegardé, tu pourras le reprendre plus tard.', 'Quitter', 'Continuer');
    if (!ok) return;
    persist();
  }
  goHome();
}

function goHome() {
  stopTimer();
  document.querySelectorAll('.screen').forEach((s) => s.classList.add('hidden'));
  document.getElementById('sh').classList.remove('hidden');
  document.getElementById('resumeBtnMw').style.display = STORE.save ? '' : 'none';
  renderHomeStats();
}

function renderHomeStats() {
  const host = document.getElementById('homeStatsMw');
  host.innerHTML = '';
  [{ v: statGet('wins'), l: '🏆 Résolus' }, { v: statGet('hintsUsed'), l: '💡 Indices utilisés' }]
    .forEach((s) => { const el = document.createElement('div'); el.className = 'statCard'; el.style.flex = '1'; el.innerHTML = '<div class="v">' + s.v + '</div><div class="l">' + s.l + '</div>'; host.appendChild(el); });
}

function showStats() {
  document.querySelectorAll('.screen').forEach((s) => s.classList.add('hidden'));
  document.getElementById('sstats').classList.remove('hidden');
  const host = document.getElementById('statsGridMw');
  host.innerHTML = '';
  const rows = [{ v: statGet('games'), l: '🎮 Parties' }, { v: statGet('wins'), l: '🏆 Résolus' }, { v: statGet('hintsUsed'), l: '💡 Indices' }];
  for (const n of [5, 6, 7, 8, 9]) { const bt = statGet('bestTime_' + n, null); if (bt !== null) rows.push({ v: Math.floor(bt/60)+':'+String(bt%60).padStart(2,'0'), l: '⏱ Record ' + n + '×' + n }); }
  rows.forEach((s) => { const el = document.createElement('div'); el.className = 'statCard'; el.innerHTML = '<div class="v">' + s.v + '</div><div class="l">' + s.l + '</div>'; host.appendChild(el); });
}

let toastTimer = null;
function toast(msg) {
  let host = document.getElementById('toastHostMw');
  if (!host) { host = document.createElement('div'); host.id = 'toastHostMw'; host.className = 'ondine-toast'; document.body.appendChild(host); }
  host.textContent = msg;
  host.classList.add('ondine-toast-show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => host.classList.remove('ondine-toast-show'), 2200);
}

function UI_confirmDialog(title, message, confirmLabel, cancelLabel) {
  return new Promise((resolve) => {
    showModal(title, '<p>' + message + '</p>', [
      { label: cancelLabel, variant: 'secondary', onClick: () => resolve(false) },
      { label: confirmLabel, variant: 'primary', onClick: () => resolve(true) },
    ]);
  });
}

document.getElementById('resumeBtnMw').style.display = STORE.save ? '' : 'none';
renderHomeStats();

</script>
