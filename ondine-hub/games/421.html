<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>421 × Ondine</title>
<meta name="theme-color" content="#06081e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06081e;--bg2:#090c24;--c1:#38bdf8;--c2:#7dd3fc;--cp:#818cf8;--cg:#34d399;--co:#fbbf24;--cr:#f87171;--cm:#f472b6;
  --glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.09);--glass3:rgba(56,189,248,.07);
  --border:rgba(56,189,248,.12);--border2:rgba(56,189,248,.22);--text:#e0f2fe;--text2:#94a3b8;
  --r:14px;--r2:20px;--sh:0 4px 20px rgba(0,0,0,.5);--sh2:0 8px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;overflow:hidden;}
.screen.hidden{display:none!important;}
.ondine-btn{font-family:'Fredoka One',cursive;border:none;border-radius:20px;cursor:pointer;transition:transform .12s;}
.ondine-btn:active{transform:scale(.955);}
.ondine-btn-primary{background:linear-gradient(135deg,#3730a3,#0e7490);color:#fff;padding:15px 28px;font-size:17px;box-shadow:0 6px 24px rgba(14,116,144,.45);}
.ondine-btn-secondary{background:var(--glass);border:1.5px solid var(--border);color:var(--text);padding:11px 22px;font-weight:800;font-size:13px;font-family:'Nunito',sans-serif;}
.ondine-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(15,25,60,.92);border:1px solid var(--border2);border-radius:12px;padding:10px 18px;font-size:13px;font-weight:700;color:var(--text);backdrop-filter:blur(12px);z-index:9999;opacity:0;transition:all .3s;white-space:nowrap;max-width:80vw;text-align:center;pointer-events:none;}
.ondine-toast-show{opacity:1;transform:translateX(-50%) translateY(0);}
.modal-overlay{position:fixed;inset:0;z-index:9500;background:rgba(6,8,30,.85);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.hidden{display:none;}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:22px;max-width:340px;width:100%;box-shadow:var(--sh2);max-height:80vh;overflow-y:auto;}
.modal-title{font-family:'Fredoka One',cursive;font-size:17px;color:var(--c2);margin-bottom:10px;text-align:center;}
.modal-body{font-size:13px;color:var(--text);margin-bottom:16px;line-height:1.6;}
.modal-actions{display:flex;flex-direction:column;gap:8px;}
.statCard{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center;}
.statCard .v{font-family:'Fredoka One',cursive;font-size:19px;color:var(--c1);}
.statCard .l{font-size:8px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.achCard{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:9px 11px;}
.achCard.unlocked{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.05);}
.achCard .ic{font-size:22px;}
.achCard .name{font-weight:800;font-size:12px;}
.achCard .desc{font-size:9px;color:var(--text2);}
.icon-btn{width:36px;height:36px;background:var(--glass);border:1px solid var(--border);border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;}

#sh{align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px;overflow-y:auto;}
.logo{font-family:'Fredoka One',cursive;font-size:clamp(38px,11vw,54px);
  background:linear-gradient(160deg,#e0f2fe,#7dd3fc 35%,#fff 55%,#bae6fd 80%,#e0f2fe);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-sub{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--c2);opacity:.65;}
.section-title{font-size:10px;text-transform:uppercase;letter-spacing:2.5px;color:var(--text2);font-weight:800;width:100%;max-width:320px;text-align:left;margin-top:6px;}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:320px;}
.opt-card{background:var(--glass);border:2px solid var(--border);border-radius:14px;padding:12px 8px;cursor:pointer;text-align:center;transition:all .15s;}
.opt-card.sel{border-color:var(--c1);background:var(--glass3);}
.opt-icon{font-size:20px;margin-bottom:3px;}
.opt-name{font-family:'Fredoka One',cursive;font-size:12px;}
.hbtns{display:flex;flex-direction:column;gap:9px;width:100%;max-width:320px;}
.hstats{display:flex;gap:7px;width:100%;max-width:320px;}

#sg{align-items:center;padding:14px;gap:14px;}
.game-header{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:380px;}
.rolls-badge{font-family:'Fredoka One',cursive;font-size:14px;background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:6px 14px;}
.players-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:380px;}
.player-pill{background:var(--glass);border:1.5px solid var(--border);border-radius:12px;padding:6px 12px;font-size:11px;font-weight:800;text-align:center;}
.player-pill.active{border-color:var(--co);background:rgba(251,191,36,.12);color:var(--co);}

.dice-row{display:flex;gap:16px;justify-content:center;}
.die{width:72px;height:72px;border-radius:16px;background:linear-gradient(145deg,#fff,#e2e8f0);color:#0f172a;
  display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 8px 20px rgba(0,0,0,.45);
  cursor:pointer;transition:all .15s;border:3px solid transparent;position:relative;}
.die.held{border-color:var(--co);box-shadow:0 0 18px rgba(251,191,36,.5),0 8px 20px rgba(0,0,0,.45);transform:translateY(-6px);}
.die.held::after{content:'🔒';position:absolute;top:-8px;right:-8px;font-size:16px;}
.die.rolling{animation:dieRoll .5s ease;}
@keyframes dieRoll{0%{transform:rotate(0);}50%{transform:rotate(180deg) scale(1.1);}100%{transform:rotate(360deg);}}

.combo-display{font-family:'Fredoka One',cursive;font-size:18px;color:var(--co);text-align:center;min-height:26px;}
.rolls-left{font-size:11px;color:var(--text2);text-align:center;}

.game-footer{display:flex;flex-direction:column;gap:9px;width:100%;max-width:320px;}
.history-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:340px;font-size:10px;color:var(--text2);}
.history-chip{background:var(--glass);border:1px solid var(--border);border-radius:8px;padding:3px 8px;}

#sres{align-items:center;justify-content:center;text-align:center;background:rgba(6,8,30,.6);backdrop-filter:blur(6px);z-index:100;gap:8px;padding:20px;}
.res-icon{font-size:56px;}
.res-title{font-family:'Fredoka One',cursive;font-size:22px;color:var(--c2);}
.res-sub{font-size:13px;color:var(--text2);}

#sstats{align-items:flex-start;padding:16px;overflow-y:auto;gap:0;}
.shead{width:100%;display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.stitle{font-family:'Fredoka One',cursive;font-size:19px;color:var(--c2);}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-bottom:14px;}
.ach-list{width:100%;display:flex;flex-direction:column;gap:6px;}
.ondine-hub-link{margin-top:6px;font-size:11px;font-weight:800;color:var(--text2);opacity:.6;cursor:pointer;text-align:center;padding:6px;}
</style>
</head>
<body>

<div id="toastHost" class="ondine-toast"></div>

<!-- ═══════ HOME ═══════ -->
<div class="screen" id="sh">
  <div class="logo">421</div>
  <div class="logo-sub">× Ondine</div>

  <div class="section-title">Mode</div>
  <div class="opt-grid">
    <div class="opt-card sel" id="modeSolo" onclick="setMode('solo')"><div class="opt-icon">🎯</div><div class="opt-name">Solo</div></div>
    <div class="opt-card" id="modeLocal" onclick="setMode('local')"><div class="opt-icon">👥</div><div class="opt-name">Local (2-4j)</div></div>
  </div>

  <div class="section-title" id="countTitle" style="display:none;">Nombre de joueurs</div>
  <div class="opt-grid" id="countGrid" style="display:none;"></div>

  <div class="hbtns" style="margin-top:8px;">
    <button class="ondine-btn ondine-btn-primary" onclick="startGame()">🎲 Nouvelle partie</button>
    <button class="ondine-btn ondine-btn-secondary" onclick="showRules()">ⓘ Règles du jeu</button>
    <button class="ondine-btn ondine-btn-secondary" onclick="showScreen('sstats')">📊 Statistiques & Succès</button>
  </div>

  <div class="hstats" id="homeStats"></div>
  <div class="ondine-hub-link" onclick="window.location.href='../index.html'">🎮 Tous les jeux Ondine</div>
</div>

<!-- ═══════ GAME ═══════ -->
<div class="screen hidden" id="sg">
  <div class="game-header">
    <div class="icon-btn" onclick="confirmLeaveGame()">🏠</div>
    <div class="rolls-badge" id="rollsBadge">Lancer 1/3</div>
    <div class="icon-btn" onclick="showRules()">ⓘ</div>
  </div>
  <div class="players-row" id="playersRow"></div>
  <div class="dice-row" id="diceRow"></div>
  <div class="combo-display" id="comboDisplay"></div>
  <div class="rolls-left" id="rollsHint">Tape sur un dé pour le conserver</div>

  <div class="game-footer">
    <button class="ondine-btn ondine-btn-primary" id="btnRoll" onclick="rollDice()">🎲 Lancer les dés</button>
    <button class="ondine-btn ondine-btn-secondary" id="btnValidate" onclick="validateTurn()" style="display:none;">✓ Valider ce résultat</button>
  </div>
  <div class="history-row" id="historyRow"></div>
</div>

<!-- ═══════ RESULT ═══════ -->
<div class="screen hidden" id="sres">
  <div class="res-icon" id="resIcon">🏆</div>
  <div class="res-title" id="resTitle"></div>
  <div class="res-sub" id="resSub"></div>
  <div class="hbtns">
    <button class="ondine-btn ondine-btn-primary" onclick="startGame()">🔄 Rejouer</button>
    <button class="ondine-btn ondine-btn-secondary" onclick="goHome()">🏠 Accueil</button>
  </div>
</div>

<!-- ═══════ STATS ═══════ -->
<div class="screen hidden" id="sstats">
  <div class="shead">
    <div class="icon-btn" onclick="goHome()">←</div>
    <div class="stitle">Statistiques</div>
  </div>
  <div style="width:100%;overflow-y:auto;padding-bottom:30px;">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="section-title" style="margin-bottom:8px;">Succès</div>
    <div class="ach-list" id="achList"></div>
  </div>
</div>

<div class="modal-overlay hidden" id="modalOverlay"></div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════
// RÈGLES DU 421 — variante "comptoir classique", documentée et
// centralisée. Si une autre variante régionale est ajoutée un jour,
// elle prend la forme d'une fonction evaluateCombo alternative
// sélectionnable, sans toucher au reste du moteur de jeu.
//
//   1. 421 (dans n'importe quel ordre) — la combinaison suprême
//   2. Nénette (1-1-1) — juste en dessous du 421
//   3. Brelans (six 6 → deux 2), du plus fort au plus faible
//   4. Suites (6-5-4, 5-4-3, 4-3-2, 3-2-1), de la plus forte à la
//      plus faible
//   5. Toute autre combinaison : classée par la somme des 3 dés
//
// 3 lancers maximum par tour. Entre chaque lancer, on peut conserver
// (verrouiller) autant de dés qu'on veut avant de relancer le reste.
// ═══════════════════════════════════════════════════════════════
function evaluateCombo(dice) {
  const d = [...dice].sort((a,b) => a-b);
  const sum = d[0]+d[1]+d[2];
  if (d[0]===1 && d[1]===2 && d[2]===4) return { tier: 0, label: '421 !', strength: 10000 };
  if (d[0]===1 && d[1]===1 && d[2]===1) return { tier: 1, label: 'Nénette (1-1-1)', strength: 9000 };
  if (d[0]===d[1] && d[1]===d[2]) return { tier: 2, label: `Brelan de ${d[0]}`, strength: 8000 + d[0] };
  if (d[1]===d[0]+1 && d[2]===d[1]+1) return { tier: 3, label: `Suite ${d[2]}-${d[1]}-${d[0]}`, strength: 7000 + d[0] };
  return { tier: 4, label: `Total ${sum}`, strength: sum };
}
function compareCombos(a, b) { return evaluateCombo(b).strength - evaluateCombo(a).strength; }

const RULES_TEXT = `
<b>But du jeu</b><br>Obtenir la meilleure combinaison possible avec 3 dés, en 3 lancers maximum.<br><br>
<b>Déroulement d'un tour</b><br>1. Premier lancer : les 3 dés.<br>2. Choisis les dés à conserver (tape dessus), relance les autres.<br>3. Un 3<sup>e</sup> lancer est possible sur les dés non conservés.<br>4. Valide ton résultat final.<br><br>
<b>Classement des combinaisons (de la meilleure à la moins bonne)</b><br>
🥇 421 (n'importe quel ordre)<br>
🥈 Nénette : 1-1-1<br>
🥉 Brelans : 6-6-6 → 2-2-2<br>
Suites : 6-5-4 → 3-2-1<br>
Sinon : la somme des 3 dés compte
`;

// ═══════════════════════════════════════════════════════════════
// STORAGE — autonome
// ═══════════════════════════════════════════════════════════════
const STORE_KEY = 'dice421_ondine_v1';
function loadStore() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(e) { return {}; } }
function saveStore(s) { localStorage.setItem(STORE_KEY, JSON.stringify(s)); }
let STORE = Object.assign({ stats: {}, achievements: [] }, loadStore());
function statGet(k, d=0) { return k in STORE.stats ? STORE.stats[k] : d; }
function statInc(k, n=1) { STORE.stats[k] = (STORE.stats[k]||0)+n; saveStore(STORE); return STORE.stats[k]; }
function statSetMax(k, v) { if (!(k in STORE.stats) || v > STORE.stats[k]) { STORE.stats[k] = v; saveStore(STORE); } }
function achUnlock(id, name, icon) {
  if (STORE.achievements.includes(id)) return;
  STORE.achievements.push(id); saveStore(STORE);
  playSound('unlock'); toast(`${icon} Succès : ${name}`);
}
const ACHIEVEMENTS = [
  { id:'first_421', name:'Premier 421', desc:'Obtenir un 421', icon:'🎯' },
  { id:'lucky', name:'Chance insolente', desc:'421 dès le premier lancer', icon:'✨' },
  { id:'steady', name:'Sans trembler', desc:'Gagner sans utiliser le 3e lancer', icon:'🧊' },
  { id:'dice_king', name:'Roi des dés', desc:'Obtenir 10 421 au total', icon:'👑' },
  { id:'wins_10', name:'10 victoires', desc:'Gagner 10 parties', icon:'🏅' },
  { id:'rare_combo', name:'Combinaison rare', desc:'Obtenir la Nénette (1-1-1)', icon:'🍀' },
];

// ═══════════════════════════════════════════════════════════════
// TOAST / SOUND / HAPTIC
// ═══════════════════════════════════════════════════════════════
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toastHost');
  t.textContent = msg; t.classList.remove('ondine-toast-show'); void t.offsetWidth; t.classList.add('ondine-toast-show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('ondine-toast-show'), 2200);
}
let audioCtx = null;
function tone(freq, dur, type='sine', vol=.12) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+dur);
    osc.start(); osc.stop(audioCtx.currentTime+dur);
  } catch(e) {}
}
function playSound(name) {
  const P = {
    roll: () => tone(400,.1,'triangle',.1),
    lock: () => tone(700,.06,'sine',.1),
    win: () => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.2,'sine',.16),i*100)),
    combo: () => [660,880].forEach((f,i)=>setTimeout(()=>tone(f,.15,'sine',.14),i*90)),
    error: () => tone(220,.15,'sawtooth',.1),
    unlock: () => [660,880,1100].forEach((f,i)=>setTimeout(()=>tone(f,.14,'sine',.14),i*80)),
  };
  (P[name]||(()=>{}))();
}
function vibrate(pattern) { if (navigator.vibrate) navigator.vibrate(pattern); }

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let CONFIG = { mode: 'solo', playerCount: 2 };
let G = null;

function setMode(m) {
  CONFIG.mode = m;
  document.getElementById('modeSolo').classList.toggle('sel', m==='solo');
  document.getElementById('modeLocal').classList.toggle('sel', m==='local');
  document.getElementById('countTitle').style.display = m==='local' ? '' : 'none';
  document.getElementById('countGrid').style.display = m==='local' ? '' : 'none';
  if (m==='local') renderCountGrid();
}
function renderCountGrid() {
  const grid = document.getElementById('countGrid'); grid.innerHTML = '';
  [2,3,4].forEach(n => {
    const el = document.createElement('div');
    el.className = 'opt-card' + (n===CONFIG.playerCount?' sel':'');
    el.innerHTML = `<div class="opt-icon">👤</div><div class="opt-name">${n} joueurs</div>`;
    el.onclick = () => { CONFIG.playerCount = n; renderCountGrid(); };
    grid.appendChild(el);
  });
}

function startGame() {
  const n = CONFIG.mode === 'solo' ? 1 : CONFIG.playerCount;
  G = {
    players: Array.from({length:n}, (_,i) => ({ name: n===1?'Toi':'Joueur '+(i+1), bestCombo: null })),
    currentIdx: 0,
    dice: [1,1,1], held: [false,false,false],
    rollsUsed: 0, maxRolls: 3,
    history: [],
    over: false,
  };
  showScreen('sg');
  renderAll();
  playSound('roll');
}
function goHome() { updateHomeStats(); showScreen('sh'); }
async function confirmLeaveGame() {
  if (G && !G.over) {
    const ok = await confirmDialog('Quitter la partie ?', 'La partie en cours sera perdue.', 'Quitter', 'Continuer');
    if (!ok) return;
  }
  goHome();
}

function rollDice() {
  if (!G || G.over) return;
  if (G.rollsUsed >= G.maxRolls) return;
  G.dice = G.dice.map((v,i) => G.held[i] ? v : (1+Math.floor(Math.random()*6)));
  G.rollsUsed++;
  playSound('roll'); vibrate(20);
  renderAll();
  if (G.rollsUsed >= G.maxRolls) {
    document.getElementById('btnRoll').style.display = 'none';
    document.getElementById('btnValidate').style.display = '';
  } else {
    document.getElementById('btnValidate').style.display = '';
  }
}
function toggleHold(i) {
  if (!G || G.over || G.rollsUsed === 0 || G.rollsUsed >= G.maxRolls) return;
  G.held[i] = !G.held[i];
  playSound('lock');
  renderAll();
}

function validateTurn() {
  if (!G || G.over || G.rollsUsed === 0) return;
  const combo = evaluateCombo(G.dice);
  const player = G.players[G.currentIdx];
  player.bestCombo = combo;
  player.usedThirdRoll = G.rollsUsed >= 3;
  G.history.push({ player: player.name, dice: [...G.dice], combo });
  playSound('combo');

  if (combo.tier === 0) { statInc('total421'); if (G.rollsUsed===1) achUnlock('lucky','Chance insolente','✨'); }
  if (combo.tier === 1) achUnlock('rare_combo','Combinaison rare','🍀');

  if (CONFIG.mode === 'solo') { endSoloTurn(combo); return; }

  G.currentIdx++;
  if (G.currentIdx >= G.players.length) { endLocalGame(); return; }
  G.dice = [1,1,1]; G.held = [false,false,false]; G.rollsUsed = 0;
  document.getElementById('btnRoll').style.display = '';
  document.getElementById('btnValidate').style.display = 'none';
  toast(`Au tour de ${G.players[G.currentIdx].name}`);
  renderAll();
}

function endSoloTurn(combo) {
  G.over = true;
  statInc('games');
  statSetMax('bestComboStrength', combo.strength);
  if (statGet('total421') >= 10) achUnlock('dice_king','Roi des dés','👑');
  if (statGet('games') >= 10 && statGet('wins') === undefined) {} // no-op, garde la logique lisible
  if (combo.tier <= 1) { statInc('wins'); playSound('win'); if (!G.players[0].usedThirdRoll) achUnlock('steady','Sans trembler','🧊'); }
  if (combo.tier === 0) achUnlock('first_421','Premier 421','🎯');
  if (statGet('wins') >= 10) achUnlock('wins_10','10 victoires','🏅');
  setTimeout(() => showSoloResult(combo), 400);
}
function showSoloResult(combo) {
  document.getElementById('resIcon').textContent = combo.tier===0 ? '🏆' : (combo.tier<=2 ? '🎉' : '🎲');
  document.getElementById('resTitle').textContent = combo.label;
  document.getElementById('resSub').textContent = `Dés : ${G.dice.join(' - ')}`;
  document.getElementById('sres').classList.remove('hidden'); /* audit UX fin de partie : overlay sans masquer le plateau/la grille en dessous */
}
function endLocalGame() {
  G.over = true;
  const ranked = [...G.players].sort((a,b) => b.bestCombo.strength - a.bestCombo.strength);
  const winner = ranked[0];
  statInc('games');
  playSound('win');
  document.getElementById('resIcon').textContent = '🏆';
  document.getElementById('resTitle').textContent = `${winner.name} gagne !`;
  document.getElementById('resSub').textContent = `${winner.bestCombo.label}`;
  document.getElementById('sres').classList.remove('hidden'); /* audit UX fin de partie : overlay sans masquer le plateau/la grille en dessous */
}

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
const FACES = ['','⚀','⚁','⚂','⚃','⚄','⚅'];
function renderAll() {
  document.getElementById('rollsBadge').textContent = `Lancer ${Math.min(G.rollsUsed+ (G.rollsUsed<G.maxRolls?1:0), G.maxRolls)}/${G.maxRolls}`;
  const diceRow = document.getElementById('diceRow'); diceRow.innerHTML = '';
  G.dice.forEach((v,i) => {
    const el = document.createElement('div');
    el.className = 'die' + (G.held[i] ? ' held' : '');
    el.textContent = FACES[v];
    el.onclick = () => toggleHold(i);
    diceRow.appendChild(el);
  });
  const combo = G.rollsUsed > 0 ? evaluateCombo(G.dice) : null;
  document.getElementById('comboDisplay').textContent = combo ? combo.label : '';
  document.getElementById('rollsHint').textContent = G.rollsUsed === 0
    ? 'Lance les dés pour commencer'
    : (G.rollsUsed >= G.maxRolls ? 'Dernier lancer effectué — valide ton résultat' : 'Tape un dé pour le conserver, relance le reste');

  const playersRow = document.getElementById('playersRow'); playersRow.innerHTML = '';
  if (CONFIG.mode === 'local') {
    G.players.forEach((p,i) => {
      const el = document.createElement('div');
      el.className = 'player-pill' + (i===G.currentIdx ? ' active' : '');
      el.textContent = p.name + (p.bestCombo ? ` (${p.bestCombo.label})` : '');
      playersRow.appendChild(el);
    });
  }

  const historyRow = document.getElementById('historyRow'); historyRow.innerHTML = '';
  G.history.slice(-5).reverse().forEach(h => {
    const chip = document.createElement('div'); chip.className = 'history-chip';
    chip.textContent = `${h.player}: ${h.combo.label}`;
    historyRow.appendChild(chip);
  });
}

// ═══════════════════════════════════════════════════════════════
// NAVIGATION / STATS / RULES
// ═══════════════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if (id==='sstats') renderStatsScreen();
}
function updateHomeStats() {
  const host = document.getElementById('homeStats'); host.innerHTML = '';
  [{v:statGet('games'),l:'🎲 Parties'},{v:statGet('wins'),l:'🏆 Victoires'},{v:statGet('total421'),l:'🎯 421'}]
    .forEach(s => { const el=document.createElement('div'); el.className='statCard'; el.style.flex='1';
      el.innerHTML = `<div class="v">${s.v}</div><div class="l">${s.l}</div>`; host.appendChild(el); });
}
function renderStatsScreen() {
  const grid = document.getElementById('statsGrid'); grid.innerHTML = '';
  [{v:statGet('games'),l:'Parties'},{v:statGet('wins'),l:'Victoires'},{v:statGet('total421'),l:'421 obtenus'},{v:statGet('bestComboStrength',0),l:'Meilleur score'}]
    .forEach(s => { const el=document.createElement('div'); el.className='statCard'; el.innerHTML=`<div class="v">${s.v}</div><div class="l">${s.l}</div>`; grid.appendChild(el); });
  const list = document.getElementById('achList'); list.innerHTML = '';
  ACHIEVEMENTS.forEach(a => {
    const unlocked = STORE.achievements.includes(a.id);
    const el = document.createElement('div'); el.className='achCard'+(unlocked?' unlocked':'');
    el.innerHTML = `<div class="ic">${a.icon}</div><div><div class="name">${a.name}</div><div class="desc">${a.desc}</div></div>`;
    list.appendChild(el);
  });
}
function showRules() {
  const overlay = document.getElementById('modalOverlay');
  overlay.innerHTML = `<div class="modal-box"><div class="modal-title">🎲 Règles du 421</div>
    <div class="modal-body">${RULES_TEXT}</div>
    <div class="modal-actions"><button class="ondine-btn ondine-btn-primary" id="mdClose">Compris !</button></div></div>`;
  overlay.classList.remove('hidden');
  document.getElementById('mdClose').onclick = () => overlay.classList.add('hidden');
}
function confirmDialog(title, message, confirmLabel, cancelLabel) {
  return new Promise((resolve) => {
    const overlay = document.getElementById('modalOverlay');
    overlay.innerHTML = `<div class="modal-box"><div class="modal-title">${title}</div><div class="modal-body">${message}</div>
      <div class="modal-actions"><button class="ondine-btn ondine-btn-primary" id="mdConfirm">${confirmLabel}</button>
      <button class="ondine-btn ondine-btn-secondary" id="mdCancel">${cancelLabel}</button></div></div>`;
    overlay.classList.remove('hidden');
    document.getElementById('mdConfirm').onclick = () => { overlay.classList.add('hidden'); resolve(true); };
    document.getElementById('mdCancel').onclick = () => { overlay.classList.add('hidden'); resolve(false); };
  });
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
updateHomeStats();
window.setMode=setMode; window.startGame=startGame; window.goHome=goHome; window.showScreen=showScreen;
window.confirmLeaveGame=confirmLeaveGame; window.rollDice=rollDice; window.toggleHold=toggleHold;
window.validateTurn=validateTurn; window.showRules=showRules;
</script>
