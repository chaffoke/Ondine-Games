<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Puzzle 15 × Ondine</title>
<meta name="theme-color" content="#06081e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../core/design-tokens.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="screen" id="sh">
  <div class="ondine-logo">PUZZLE 15</div>
  <div class="ondine-logo-sub">× Ondine</div>
  <div id="homeStats15"></div>
  <button class="ondine-btn ondine-btn-primary" onclick="startGame()">🔢 Jouer</button>
  <button class="ondine-btn ondine-btn-secondary" id="resumeBtn15" onclick="resumeGame()" style="display:none;">▶ Reprendre</button>
  <button class="ondine-btn ondine-btn-secondary" onclick="showStats()">📊 Succès</button>
</div>

<div class="screen hidden" id="sg">
  <div class="hud15">
    <div class="ondine-icon-btn" onclick="goHome()">🏠</div>
    <div class="badge" id="moves15">0 coups</div>
    <div class="badge" id="timer15">⏱ 0s</div>
  </div>
  <div id="winBanner15" style="display:none;">🏆 Résolu !</div>
  <div id="grid15"></div>
  <div class="footer15">
    <button class="ondine-btn ondine-btn-secondary" style="flex:1;" id="undoBtn15" onclick="undo15()">↩️ Annuler</button>
    <button class="ondine-btn ondine-btn-secondary" style="flex:1;" onclick="confirmNewGame()">🔄 Nouvelle</button>
  </div>
</div>

<div class="screen hidden" id="sstats">
  <div class="ondine-icon-btn" onclick="goHome()">←</div>
  <div id="achList15"></div>
</div>

<script type="module" src="./game.js"></script>
</body>
</html>
