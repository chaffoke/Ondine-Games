<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Tetris × Ondine</title>
<meta name="theme-color" content="#06081e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../core/design-tokens.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="screen" id="sh">
  <div class="ondine-logo">TETRIS</div>
  <div class="ondine-logo-sub">× Ondine</div>
  <div id="homeStatsTetris"></div>
  <button class="ondine-btn ondine-btn-primary" onclick="startGame()">🧱 Jouer</button>
  <button class="ondine-btn ondine-btn-secondary" onclick="showStats()">📊 Succès</button>
</div>

<div class="screen hidden" id="sg">
  <div class="tetris-hud">
    <div class="ondine-icon-btn" onclick="goHome()">🏠</div>
    <span>Score: <span id="tetrisScore">0</span></span>
    <span>Lignes: <span id="tetrisLines">0</span></span>
    <span>Niv. <span id="tetrisLevel">1</span></span>
  </div>
  <div id="tetrisOverBanner" style="display:none;">💀 Game Over</div>
  <div class="tetris-layout">
    <div class="tetris-side">
      <div class="tetris-side-box"><div class="tetris-side-label">Hold</div><div id="tetrisHold"></div></div>
      <div class="tetris-side-box"><div class="tetris-side-label">Next</div><div id="tetrisNext"></div></div>
    </div>
    <div id="tetrisGrid"></div>
  </div>
  <div class="tetris-controls">
    <div class="tetris-btn" onclick="onMove(-1)">⬅️</div>
    <div class="tetris-btn" onclick="onRotate()">🔄</div>
    <div class="tetris-btn" onclick="onMove(1)">➡️</div>
    <div class="tetris-btn" onclick="onHold()">🎯</div>
    <div class="tetris-btn" ontouchstart="onSoftDropStart()" ontouchend="onSoftDropEnd()" onmousedown="onSoftDropStart()" onmouseup="onSoftDropEnd()">⬇️</div>
    <div class="tetris-btn" onclick="onHardDrop()" style="grid-column:span 2;">⏬ Chute</div>
    <div class="tetris-btn" onclick="confirmNewGame()">🔄</div>
  </div>
</div>

<div class="screen hidden" id="sstats">
  <div class="ondine-icon-btn" onclick="goHome()">←</div>
  <div id="achListTetris"></div>
</div>

<script type="module" src="./game.js"></script>
</body>
</html>
