<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Échecs × Ondine</title>
<meta name="theme-color" content="#06081e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../core/design-tokens.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="screen" id="sh">
  <div class="ondine-logo">ÉCHECS</div>
  <div class="ondine-logo-sub">× Ondine</div>
  <div id="homeStatsChess"></div>

  <div class="opt-grid">
    <div class="opt-card sel" id="modeSolo" onclick="setMode('solo')">🤖 Solo vs IA</div>
    <div class="opt-card" id="modeLocal" onclick="setMode('local')">👥 2 Joueurs</div>
  </div>
  <div class="opt-grid cols3" id="diffGrid">
    <div class="opt-card" id="diffEasy" onclick="setDifficulty('easy')">🌱 Facile</div>
    <div class="opt-card sel" id="diffNormal" onclick="setDifficulty('normal')">⚡ Normal</div>
    <div class="opt-card" id="diffHard" onclick="setDifficulty('difficile')">🔥 Difficile</div>
  </div>

  <button class="ondine-btn ondine-btn-primary" onclick="startGame()">♟️ Jouer</button>
  <button class="ondine-btn ondine-btn-secondary" onclick="showStats()">📊 Succès</button>
</div>

<div class="screen hidden" id="sg">
  <div class="ondine-icon-btn" onclick="goHome()" style="align-self:flex-start;">🏠</div>
  <div id="chessStatus"></div>
  <div id="chessBoard"></div>
  <button class="ondine-btn ondine-btn-secondary" onclick="confirmNewGame()">🔄 Nouvelle partie</button>
</div>

<div class="screen hidden" id="sstats">
  <div class="ondine-icon-btn" onclick="goHome()">←</div>
  <div id="achListChess"></div>
</div>

<script type="module" src="./game.js"></script>
</body>
</html>
