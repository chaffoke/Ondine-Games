<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>2048 × Ondine</title>
<meta name="theme-color" content="#06081e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../core/design-tokens.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="screen" id="sh">
  <div class="ondine-logo">2048</div>
  <div class="ondine-logo-sub">× Ondine</div>
  <div id="homeStats2048"></div>
  <div class="ondine-btn ondine-btn-primary" onclick="startGame()" style="cursor:pointer;">🧩 Jouer</div>
  <button class="ondine-btn ondine-btn-secondary" id="resumeBtn2048" onclick="resumeGame()" style="display:none;">▶ Reprendre</button>
  <button class="ondine-btn ondine-btn-secondary" onclick="showStats()">📊 Succès</button>
</div>

<div class="screen hidden" id="sg">
  <div class="hud2048">
    <div class="ondine-icon-btn" onclick="goHome()">🏠</div>
    <div class="box"><div class="n" id="score2048">0</div><div class="l">Score</div></div>
    <div class="box"><div class="n" id="best2048">0</div><div class="l">Record</div></div>
  </div>
  <div id="banner2048"></div>
  <div id="grid2048"></div>
  <div class="footer2048">
    <button class="ondine-btn ondine-btn-secondary" id="undoBtn2048" onclick="undo2048()">↩️ Annuler</button>
    <button class="ondine-btn ondine-btn-secondary" onclick="confirmNewGame()">🔄 Nouvelle</button>
    <button class="ondine-btn ondine-btn-primary" id="continueBtn2048" onclick="continueAfterWin()" style="display:none;">Continuer</button>
  </div>
  <div style="font-size:11px;color:var(--text2);text-align:center;">Flèches du clavier ou glisser au doigt</div>
</div>

<div class="screen hidden" id="sstats">
  <div class="ondine-icon-btn" onclick="goHome()">←</div>
  <div id="achList2048"></div>
</div>

<script type="module" src="./game.js"></script>
</body>
</html>
