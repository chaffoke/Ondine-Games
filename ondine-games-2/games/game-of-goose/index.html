<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Jeu de l'Oie × Ondine</title>
<meta name="theme-color" content="#06081e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../core/design-tokens.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="screen" id="sh">
  <div class="ondine-logo">JEU DE L'OIE</div>
  <div class="ondine-logo-sub">× Ondine</div>
  <div id="homeStatsGoose"></div>
  <div class="opt-grid">
    <div class="opt-card sel" id="pcount2" onclick="setPlayerCount(2)">2 joueurs</div>
    <div class="opt-card" id="pcount3" onclick="setPlayerCount(3)">3 joueurs</div>
    <div class="opt-card" id="pcount4" onclick="setPlayerCount(4)">4 joueurs</div>
  </div>
  <div class="opt-card" id="vsAiBtn" onclick="setVsAI(!document.getElementById('vsAiBtn').classList.contains('sel'))" style="max-width:300px;">🤖 vs IA (sinon local)</div>
  <button class="ondine-btn ondine-btn-primary" onclick="startGame()">🎲 Jouer</button>
  <button class="ondine-btn ondine-btn-secondary" onclick="showStats()">📊 Succès</button>
</div>

<div class="screen hidden" id="sg">
  <div class="ondine-icon-btn" onclick="goHome()" style="align-self:flex-start;">🏠</div>
  <div id="gooseTurn"></div>
  <div id="gooseOverBanner"></div>
  <div id="gooseBoard"></div>
  <div id="gooseLog"></div>
  <button class="ondine-btn ondine-btn-primary" id="rollBtn" onclick="rollForCurrentPlayer()">🎲 Lancer le dé</button>
</div>

<div class="screen hidden" id="sstats">
  <div class="ondine-icon-btn" onclick="goHome()">←</div>
  <div id="achListGoose"></div>
</div>

<script type="module" src="./game.js"></script>
</body>
</html>
